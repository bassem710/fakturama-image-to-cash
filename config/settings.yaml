fakturama_exe: "C:/Program Files/Fakturama2/Fakturama.exe"
runs_dir: "runs"

extraction:
  model: "gemini-flash-latest"    # Google AI Studio model id (alias of the current Gemini Flash); override with --model
  source_date_formats: ["%Y-%m-%d", "%d.%m.%Y", "%d/%m/%Y"]

ui:
  date_format: "%b {day}, %Y"     # Fakturama en_US shows "Nov 6, 2026"; {day} = day without zero padding
  ocr_language: "en"
  timeouts:                       # seconds
    element: 10
    dialog: 15
    list_stable: 10
    app_start: 120
