fakturama_exe: "C:/Program Files/Fakturama2/Fakturama.exe"
runs_dir: "runs"

workspace:                        # `imagetocash reset-workspace --yes` (test runs only; moves, never deletes)
  dir: "C:/fakturama"
  clean_backup: "C:/fakturama/Backup/Backup_20261106_022075.zip"   # Fakturama's own backup right after first setup
  backups_dir: "C:/fakturama-backups"

extraction:
  # Google AI Studio model ids; override with --model. Flash-Lite first: on 2026-11-06 the Flash models
  # answered only with overload errors (several minutes per run) while Flash-Lite answered in ~4 s.
  model: "gemini-flash-lite-latest"
  fallback_models: ["gemini-3.8-flash-lite", "gemini-flash-latest", "gemini-3.8-flash"]   # tried in order if a model stays overloaded (429/5xx)
  source_date_formats: ["%Y-%m-%d", "%d.%m.%Y", "%d/%m/%Y"]

ui:
  date_format: "%b {day}, %Y"     # Fakturama en_US shows "Nov 6, 2026"; {day} = day without zero padding
  ocr_language: "en"
  timeouts:                       # seconds
    element: 10
    dialog: 15
    list_stable: 10
    app_start: 120
