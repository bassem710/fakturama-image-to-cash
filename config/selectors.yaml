# Control map for Fakturama 2.2.0 (en_US), verified with live UIA discovery (docs/control-map.md).
# Every UI element the automation touches is named here, so a label or layout change is a config edit.
#
# Locator forms (a list = try in order, first hit wins):
#   {by: properties, control_type: Button, name: "Save the current contents", name_prefix: "Create", index: 0}
#   {by: label, label: "Cust.Ref.", target: Edit, nth: 0, label_type: Text}   # unnamed field after its label
#   {by: order, label: "Addresses", target: Image, position: 0}               # Nth icon in the label's container

app:                                    # the main window and Fakturama's own error dialog
  main_window_class: "SWT_Window0"
  main_title_prefix: "Fakturama -"
  internal_error_title: "Internal Error"
  error_ok: "OK"
  # Ctrl+C on an EMPTY NatTable raises "Internal Error ... copiedCells is null": harmless, acknowledged
  # as an empty table. Any other Internal Error stops the run.
  empty_copy_error_marker: "copiedCells"

main:
  new_order: {by: properties, control_type: Button, name: "Create: New Order"}
  save: {by: properties, control_type: Button, name: "Save the current contents"}
  data_menu: {by: properties, control_type: MenuItem, name: "Data"}   # Expand, then Invoke the view item
  new_contact: {by: properties, control_type: Text, name: "New Contact"}      # New panel (navigation view)
  new_product: {by: properties, control_type: Text, name: "New product"}
  # Fallbacks: the New panel entry re-focuses an already open "new" editor part instead of opening a
  # fresh one (seen live); the toolbar buttons always open a fresh editor.
  new_contact_toolbar: {by: properties, control_type: SplitButton, name: "Create a new contact"}
  new_product_toolbar: {by: properties, control_type: Button, name: "Create a new product"}
  new_editor_title_prefix: "New"

data_views:                             # entries of the navigation view's Data group
  documents: "Documents"
  vats: "VATs"
  payment_methods: "terms of payment"

order_editor:
  tab_title: "New Order"
  number: {by: label, label: "No.", target: Edit}
  date: {by: label, label: "Date", target: Edit}                # Nebula CDateTime: set with date_input
  price_mode: {by: label, label: "Date", target: ComboBox}      # Gross / Net, right of the date
  customer_reference: {by: properties, control_type: Edit, name: "Cust.Ref."}
  vat_mode: {by: properties, control_type: ComboBox, name: "VAT"}
  select_address: {by: order, label: "Addresses", target: Image, position: 0}   # upper icon; lower = green +
  select_product: {by: order, label: "Items", target: Image, position: 0}
  discount: {by: properties, control_type: Edit, name: "Discount"}
  shipping: {by: properties, control_type: ComboBox, name: "Shipping"}
  total_net:
    - {by: properties, control_type: Edit, name: "Total Net"}
    - {by: properties, control_type: Edit, name: "Total Gross"}
  vat_total: {by: properties, control_type: Edit, name: "VAT"}
  total: {by: properties, control_type: Edit, name: "Total"}
  follow_up_invoice: {by: properties, control_type: Button, name: "Invoice"}
  address_tabs: {invoice: "Invoice address", delivery: "Delivery address"}   # first = left selected for Save
  price_mode_net: "Net"
  shipping_free_word: "free"                        # 4.2: the shipping combo shows "Free of shipping costs"
  # Copy order (seen live): the row-number column is NatTable's row header, not copied and not a
  # keyboard cell, so Ctrl+Home lands on Qty. VAT copies as the record's toString (taxValue: [0.19]).
  items_order: [quantity, sku, picture, name, description, vat, unit_price, discount, price]
  items_columns:                        # header text -> field, for the OCR fallback
    "Item No.": sku
    "Qty.": quantity
    "U.Price": unit_price
    "VAT": vat
    "Discount": discount
    "Price": price

selection_dialogs:                      # top-level #32770 windows
  address_title: "Select the address"
  product_title: "Select a product"
  search: {by: label, label: "Search:", target: Edit}
  ok: {by: properties, control_type: Button, name: "OK"}
  cancel: {by: properties, control_type: Button, name: "Cancel"}
  # Clipboard copy (Ctrl+A/Ctrl+C) gives raw values in display order, no header: one field per column.
  address_order: [number, first_name, last_name, company, zip, city]
  product_order: [sku, name, description, stock, price, vat]
  address_columns: {"No.": number, "First Name": first_name, "Name": last_name, "Company": company, "ZIP": zip, "City": city}
  product_columns: {"Item No.": sku, "Name": name, "Description": description, "Price": price, "VAT": vat}

lists:
  search: {by: label, label: "Search:", target: Edit}
  create_new: {by: properties, control_type: Button, name_prefix: "Create"}   # "Create a new tax rate", ...
  vat_order: [standard, name, description, value]          # value is a fraction (0.19)
  payment_order: [standard, name, description, discount, discount_days, net_days]
  documents_order: [type, number, date, customer, reference, state, total, printed]
  vat_columns: {"Name": name, "Description": description, "Value": value}    # no VAT code column (see VatListScreen)
  payment_columns: {"Name": name, "Description": description}
  documents_columns: {"Document": number, "Date": date, "Name": customer, "Cust.Ref.": reference, "State": state, "Total": total}
  document_type_by_prefix: {"PO": order, "IN": invoice}
  # The State column copies the key of its state ICON (iconset.properties), not a word (seen live).
  document_state_by_key: {COMMAND_ORDER_PENDING: open, COMMAND_ORDER_PROCESSING: processing, COMMAND_ORDER_SHIPPED: shipped, COMMAND_CHECKED: paid, COMMAND_UNCHECKED: open}

debtor_editor:
  company: {by: properties, control_type: Edit, name: "Company"}
  first_name: {by: label, label: "First Name Last Name", target: Edit, nth: 0}
  last_name: {by: label, label: "First Name Last Name", target: Edit, nth: 1}
  addresses_tab: "Addresses"
  main_address_tab: "Main address"
  additional_address_tab: "additional address #1"
  add_address: {by: properties, control_type: Button, name: "+"}
  additional_name: {by: properties, control_type: Edit, name: "additional name"}
  street: {by: properties, control_type: Edit, name: "Street"}
  zip: {by: label, label: "ZIP - City", target: Edit, nth: 0}
  city: {by: label, label: "ZIP - City", target: Edit, nth: 1}
  country: {by: properties, control_type: ComboBox, name: "Country"}
  email: {by: properties, control_type: Edit, name: "E-Mail"}
  telephone: {by: properties, control_type: Edit, name: "Telephone"}
  address_type_label: "address type"   # the button after this label opens the role popup
  invoice_role: {by: properties, control_type: CheckBox, name: "Invoice address"}   # in the popup (main window)
  delivery_role: {by: properties, control_type: CheckBox, name: "Delivery address"}
  miscellaneous_tab: "Miscellaneous"
  alias: {by: properties, control_type: Edit, name: "Alias name"}
  discount: {by: properties, control_type: Edit, name: "Discount"}
  net_or_gross: {by: properties, control_type: ComboBox, name: "Net or Gross"}
  net_option: "Net"
  payment_method: {by: properties, control_type: ComboBox, name: "Payment"}

payment_method_editor:                  # tab "New Term of Payment"
  name: {by: properties, control_type: Edit, name: "Name"}
  description: {by: properties, control_type: Edit, name: "Description"}
  payment_code: {by: properties, control_type: ComboBox, name: "!editorPaymentPaymentcode!"}  # Fakturama's own (untranslated) label
  cash_discount: {by: properties, control_type: Edit, name: "Cash discount"}
  discount_days: {by: properties, control_type: Edit, name: "Discount Days"}
  net_days: {by: properties, control_type: Edit, name: "Net Days"}

vat_editor:                             # tab "New TAX Rate"
  name: {by: properties, control_type: Edit, name: "Name"}
  description: {by: properties, control_type: Edit, name: "Description"}
  code: {by: properties, control_type: ComboBox, name: "VAT code (E-Invoice)"}
  value: {by: properties, control_type: Edit, name: "Value"}
  standard_code_option: "S (Standard rate)"

product_editor:                         # tab "New product"
  item_number: {by: properties, control_type: Edit, name: "Item Number"}
  name: {by: properties, control_type: Edit, name: "Name"}
  description: {by: properties, control_type: Edit, name: "Description"}
  price_gross: {by: label, label: "Price (gross)", target: Edit}
  cost_price: {by: label, label: "cost price (net)", target: Edit}
  vat: {by: properties, control_type: ComboBox, name: "VAT"}
  stock: {by: properties, control_type: Edit, name: "Stock"}

invoice_editor:                         # same layout as the Order editor, plus the payment row
  number: {by: label, label: "No.", target: Edit}
  customer_reference: {by: properties, control_type: Edit, name: "Cust.Ref."}
  order_date: {by: label, label: "Order Date", target: Edit}
  vat_mode: {by: properties, control_type: ComboBox, name: "VAT"}
  paid: {by: properties, control_type: CheckBox, name: "paid"}
  payment_method: {by: label, label: "paid", label_type: CheckBox, target: ComboBox}
  payment_date: {by: label, label: "at", target: Edit}           # appears once 'paid' is ticked; CDateTime
  paid_value: {by: properties, control_type: Edit, name: "Value"}
